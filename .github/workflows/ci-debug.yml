name: CI Debug

on:
  push:
    branches:
      - feat/investigate-cli

jobs:
  debug:
    name: CI Debug Job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print runner info
        run: |
          echo "CI DEBUG: runner info"
          uname -a || true
          cat /etc/os-release || true
      - name: Verify Python
        run: |
          python --version || true
          python -c "import sys; print('python ok', sys.version)" || true
      - name: Simple script
        run: |
          echo "Listing repo root:"; ls -la || dir || true
          echo "Done."
      - name: Create small artifact
        run: |
          mkdir -p tmp
          echo "ci-debug" > tmp/ci-debug.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-artifact
          path: tmp/ci-debug.txt
