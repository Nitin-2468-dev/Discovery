name: "Docs: linkcheck & spellcheck"

on:
  pull_request:
  push:
    branches:
      - master
      - 'work/*'

jobs:
  linkcheck:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v1
        with:
          # Scan markdown files in docs and README
          args: --verbose --no-progress 'README.md' 'docs/**/*.md'
  codespell:
    name: Spell check (codespell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install codespell
        run: python -m pip install --upgrade pip && python -m pip install codespell
      - name: Run codespell on docs
        run: codespell --ignore-words-list='teh,recieve' README.md docs/
