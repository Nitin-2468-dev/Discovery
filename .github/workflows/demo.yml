name: "Demo: e2e demo"

# Manual dispatch + optional weekly schedule for maintainers to run the demo
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 12 * * 0' # weekly on Sundays at 12:00 UTC (optional)

jobs:
  run-demo:
    name: Run demo and upload artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install project in editable mode
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run demo script
        run: |
          mkdir -p demo-out
          python scripts/demo_e2e.py --output-dir demo-out

      - name: Upload demo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: probe-demo-artifacts
          path: demo-out/**
          retention-days: 7
