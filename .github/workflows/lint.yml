name: Lint & Type Checks

on:
  pull_request:
    paths-ignore:
      - 'results/**'
      - 'run_reports/**'
  push:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install tools
        run: pip install --upgrade pip && pip install ruff mypy pre-commit
      - name: Run pre-commit
        run: |
          pre-commit run --all-files
      - name: Run ruff
        run: ruff check .
      - name: Run mypy
        run: mypy .
