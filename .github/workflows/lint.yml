name: Lint & Type Checks

on:
  pull_request:
    paths-ignore:
      - 'results/**'
      - 'run_reports/**'
  push:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install ruff mypy pre-commit black==25.12.0 isort==7.0.0 types-PyYAML

      - name: Check formatters (black + isort)
        run: |
          # Run Black and isort in check mode to avoid CI pushing changes
          black --check . || (echo "Black found formatting issues; run 'black .' locally to fix them." && exit 1)
          isort --check-only . || (echo "isort found import-order issues; run 'isort .' locally to fix them." && exit 1)

      - name: Check for formatting diffs (no auto-commit)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if ! git diff --quiet --exit-code; then
            echo "Formatting changes detected. Please run 'black .' and 'isort .' locally and push the fixes."
            git --no-pager diff --name-only
            exit 1
          else
            echo "No formatting changes"
          fi

      - name: Run pre-commit (check-only)
        id: precommit
        run: |
          # Run pre-commit and fail with instructions instead of committing from CI
          pre-commit run --all-files --show-diff-on-failure || (echo "pre-commit hooks detected problems; run 'pre-commit run --all-files' locally to fix." && exit 1)

      - name: Run ruff
        run: ruff check .
      - name: Run mypy
        run: mypy .

  autofix:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install formatters & pre-commit
        run: |
          pip install --upgrade pip
          pip install pre-commit black==25.12.0 isort==7.0.0
      - name: Run pre-commit (check-only, no push)
        run: |
          # Run pre-commit in check-only mode; do not attempt to commit/push from CI
          pre-commit run --all-files --show-diff-on-failure || (echo "pre-commit hooks detected problems; run 'pre-commit run --all-files' locally to fix." && exit 1)
