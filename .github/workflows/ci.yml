name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # weekly on Monday at 03:00 UTC

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
        ocr: [false, true]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install package in editable mode to expose optional extras
          pip install -e .
          if [ "${{ matrix.ocr }}" = "true" ]; then
            pip install -r requirements-ocr.txt || pip install -e .[ocr]
          fi
      - name: Run tests
        env:
          CI: true
        run: |
          pytest -q --maxfail=1 --disable-warnings

  test-ocr-scheduled:
    name: OCR test (scheduled / ocr branch)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/heads/ocr')
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (OCR extras)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ocr.txt
      - name: Run tests
        env:
          CI: true
        run: |
          pytest -q
