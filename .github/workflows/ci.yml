name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # weekly on Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
        ocr: [false, true]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt','**/requirements-ocr.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install package in editable mode to expose optional extras
          pip install -e .
          if [ "${{ matrix.ocr }}" = "true" ]; then
            pip install -r requirements-ocr.txt || pip install -e .[ocr]
          fi
      - name: Run tests
        env:
          CI: true
        run: |
          mkdir -p reports
          pytest -q --maxfail=1 --disable-warnings --junitxml=reports/junit-${{ matrix.python-version }}-${{ matrix.ocr }}.xml
      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}-${{ matrix.ocr }}
          path: reports/junit-${{ matrix.python-version }}-${{ matrix.ocr }}.xml

  packaging:
    name: Packaging & editable install verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
        ocr: [false, true]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip (packaging)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-packaging-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml','**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-packaging-
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Verify editable install and extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          if [ "${{ matrix.ocr }}" = "true" ]; then
            pip install -e .[ocr]
          fi
      - name: Build sdist & wheels
        run: |
          python -m build --sdist --wheel --outdir dist
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}-${{ matrix.ocr }}
          path: dist/


  test-ocr-scheduled:
    name: OCR test (scheduled / ocr branch)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/heads/ocr')
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (OCR extras)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ocr.txt
      - name: Run tests
        env:
          CI: true
        run: |
          pytest -q
