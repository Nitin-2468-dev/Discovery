name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # weekly on Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  test:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
        ocr: [false, true]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install package in editable mode to expose optional extras
          pip install -e .
          if [ "${{ matrix.ocr }}" = "true" ]; then
            pip install -r requirements-ocr.txt || pip install -e .[ocr]
          fi
      - name: Run tests
        env:
          CI: true
        run: |
          pytest -q --maxfail=1 --disable-warnings

  packaging:
    name: Packaging & editable install verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
        ocr: [false, true]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Verify editable install and extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          if [ "${{ matrix.ocr }}" = "true" ]; then
            pip install -e .[ocr]
          fi
      - name: Build sdist & wheels
        run: |
          python -m build --sdist --wheel --outdir dist

  preflight:
    name: 'Preflight: Packaging validation'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: 'Preflight: check for empty non-__init__ Python files'
        run: |
          set -e
          # Find tracked Python files under probe/ and tests/ that are empty, but ignore __init__.py
          empty_files=$(git ls-files | grep -E '^(probe/|tests/).*\.py$' | while read -r f; do base=$(basename "$f"); if [ "$base" = "__init__.py" ]; then continue; fi; if [ ! -s "$f" ]; then echo "$f"; fi; done)
          if [ -n "$empty_files" ]; then
            echo "ERROR: empty non-__init__ Python files found:";
            echo "$empty_files";
            exit 1;
          fi
      - name: Install dependencies for preflight
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tomli || true
      - name: Run packaging validation tests
        run: |
          pytest -q tests/test_packaging_validation.py tests/test_wheel_install.py -q --maxfail=1

  test-ocr-scheduled:
    name: OCR test (scheduled / ocr branch)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/heads/ocr')
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (OCR extras)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ocr.txt
      - name: Run tests
        env:
          CI: true
        run: |
          pytest -q
